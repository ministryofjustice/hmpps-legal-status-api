generic-service:
  nameOverride: hmpps-legal-status-api
  productId: "DPS146" # productId for the product that this belongs too, i.e. DPS001, see README.md for details

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-legal-status-api
    tag: app_version # override at deployment time
    port: 8080

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-legal-status-api-cert
    annotations:
      # Secure the endpoints related to k8s jobs from outside the Kubernetes ingress
      nginx.ingress.kubernetes.io/server-snippet: |
        server_tokens off;
        location /queue-admin/retry-all-dlqs {
          deny all;
          return 401;
        }

  # Used to access resources like SQS queues and SNS topics (IRSA service account created in cloud-platform-environments, IS-54)
  serviceAccountName: hmpps-legal-status-api

  # Environment variables to load into the deployment
  env:
    SERVER_PORT: "8080"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.json
    DB_SSL_MODE: "verify-full"
    HMPPS_SQS_ENABLED: "true"
    # JAVA_TOOL_OPTIONS is set in the base image (hmpps-eclipse-temurin) with:
    #   -XX:MaxRAMPercentage=50.0
    # Uncomment below to override memory settings if needed.
    # Check resources.limits.memory is set appropriately.
    #
    # Percentage-based example:
    #   JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"
    #
    # Fixed memory example:
    #   JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1024m"

  # Pre-existing kubernetes secrets to load as environment variables in the deployment.
  # namespace_secrets:
  #   [name of kubernetes secret]:
  #     [name of environment variable as seen by app]: [key of kubernetes secret to load]

  namespace_secrets:
    hmpps-legal-status-api-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    rds-postgresql-instance-output:
      DB_SERVER: "rds_instance_endpoint"
      DB_NAME: "database_name"
      DB_USER: "database_username"
      DB_PASS: "database_password"
    hmpps-legal-status-api-client-creds:
      MANAGE_OFFENCES_API_CLIENT_ID: "MANAGE_OFFENCES_API_CLIENT_ID"
      MANAGE_OFFENCES_API_CLIENT_SECRET: "MANAGE_OFFENCES_API_CLIENT_SECRET"
      PRISONER_SEARCH_API_CLIENT_ID: "PRISONER_SEARCH_API_CLIENT_ID"
      PRISONER_SEARCH_API_CLIENT_SECRET: "PRISONER_SEARCH_API_CLIENT_SECRET"
      REMAND_AND_SENTENCING_API_CLIENT_ID: "REMAND_AND_SENTENCING_API_CLIENT_ID"
      REMAND_AND_SENTENCING_API_CLIENT_SECRET: "REMAND_AND_SENTENCING_API_CLIENT_SECRET"
    # Inbound domain events queue and DLQ (IS-54)
    domain-events-queue-secret:
      HMPPS_SQS_QUEUES_DOMAINEVENTS_QUEUE_NAME: "queue_name"
    domain-events-dlq-secret:
      HMPPS_SQS_QUEUES_DOMAINEVENTS_DLQ_NAME: "queue_name"

generic-prometheus-alerts:
  targetApplication: hmpps-legal-status-api
