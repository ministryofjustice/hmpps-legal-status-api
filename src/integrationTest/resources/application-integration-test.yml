server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

manage-offences:
  api:
    url: "http://localhost:8091"
    client:
      id: "manage-offences-api-client"
      secret: "manage-offences-api-secret"
prisoner-search:
  api:
    url: "http://localhost:8092"
    client:
      id: "prisoner-search-api-client"
      secret: "prisoner-search-api-secret"
remand-and-sentencing:
  api:
    url: "http://localhost:8093"
    client:
      id: "remand-and-sentencing-api-client"
      secret: "remand-and-sentencing-api-secret"

slack:
  webhook:
    url: "http://localhost:8094"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

hmpps.sqs:
  enabled: true
  provider: localstack
  queues:
    domainevents:
      queueName: legal-status-domain-events-queue
      dlqName: legal-status-domain-events-dlq
      subscribeTopicId: hmppseventtopic
      subscribeFilter: '{"eventType":["prison-offender-events.prisoner.imprisonment-status-changed"]}'
      dlqMaxReceiveCount: 1
      visibilityTimeout: 1
  topics:
    hmppseventtopic:
      arn: arn:aws:sns:eu-west-2:000000000000:hmpps-domain-events-topic
