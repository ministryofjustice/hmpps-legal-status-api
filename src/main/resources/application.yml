info.app:
  name: HMPPS Legal Status Api
  version: 1.0

spring:
  application:
    name: hmpps-legal-status-api

  datasource:
    url: "jdbc:postgresql://${db.server}/${db.name}?sslmode=${db.ssl.mode}"
    username: "${db.user}"
    password: "${db.pass}"
    hikari:
      pool-name: Legal-Status-DB-CP
      connectionTimeout: 1000
      validationTimeout: 500

  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    validateMigrationNaming: true
    locations: classpath:/db/migration/common

  jpa:
    open-in-view: false
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate

#  This jackson configuration is only applied for java.util.Date.
#  It is ignored for LocalDateTime, and therefore unnecessary for most projects
#  jackson:
#    date-format: "yyyy-MM-dd HH:mm:ss"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${hmpps-auth.url}/.well-known/jwks.json

      client:
        provider:
          hmpps-auth:
            token-uri: ${hmpps-auth.url}/oauth/token
        registration:
          manage-offences-api:
            provider: hmpps-auth
            client-id: ${manage-offences.api.client.id}
            client-secret: ${manage-offences.api.client.secret}
            authorization-grant-type: client_credentials
          prisoner-search-api:
            provider: hmpps-auth
            client-id: ${prisoner-search.api.client.id}
            client-secret: ${prisoner-search.api.client.secret}
            authorization-grant-type: client_credentials
          remand-and-sentencing-api:
            provider: hmpps-auth
            client-id: ${remand-and-sentencing.api.client.id}
            client-secret: ${remand-and-sentencing.api.client.secret}
            authorization-grant-type: client_credentials
  http:
    codecs:
      max-in-memory-size: 10MB
  web:
    error:
      include-message: always

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: 'info, health'
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

slack:
  # Turned off until the Slack app's webhook URL is available
  enabled: false
