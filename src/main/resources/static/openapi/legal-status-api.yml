openapi: 3.1.1
info:
  title: Legal Status API
  version: '0.0.2'
  description: Legal Status API
  contact:
    name: Move & Improve team
    email: moveandimprove@justice.gov.uk
servers:
  - url: https://legal-status-api-dev.hmpps.service.justice.gov.uk
    description: Development
  - url: https://legal-status-api-preprod.hmpps.service.justice.gov.uk
    description: Pre-Production
  - url: https://legal-status-api.hmpps.service.justice.gov.uk
    description: Production
  - url: http://localhost:8080
    description: Local

security:
  - bearerAuth: [ ]

tags:
  - name: Sync
    description: | 
      The Sync endpoints are specifically and exclusively to facilitate NOMIS sync processes by the Syscon sync process.  
      **These endpoints must not be used for any other purpose or consumer**
      
      Refer to the documentation for the individual endpoint/methods, but requests to all Sync endpoints require one of
      the roles:
      - `ROLE_LEGAL_STATUS__SYNC__RW` (Read-Write)

paths:
  '/temp/legacy/imprisonment-status/{prisonNumber}':
    parameters:
      - $ref: "#/components/parameters/prisonNumberPathParameter"
    get:
      tags:
        - temporary
      responses:
        '200':
          description: The Imprisonment Status for the prisoner

  '/sync/imprisonment-status':
    post:
      summary: Creates a single Imprisonment Status.
      description: |
        Creates a new Imprisonment Status using the specified request body.
        
        **Role Requirements:**
        Access to this endpoint requires one of the following roles:
          - `ROLE_LEGAL_STATUS__SYNC__RW` (Read-Write)
      tags:
        - Sync
      operationId: sync-create-imprisonmentStatus
      requestBody:
        $ref: '#/components/requestBodies/SyncCreateImprisonmentStatus'
      responses:
        '204':
          $ref: '#/components/responses/SyncCreateImprisonmentStatus'
        '400':
          $ref: '#/components/responses/400Error'
          description: There was a problem with the request or request body, such as a validation error.

  '/sync/imprisonment-status/{legacyImprisonmentStatusId}':
    parameters:
      - $ref: "#/components/parameters/legacyImprisonmentStatusIdPathParameter"
    delete:
      summary: Deletes a single Imprisonment Status by UUID.
      description: |
        Hard-deletes the specified Imprisonment Status.
        
        **Role Requirements:**
        Access to this endpoint requires one of the following roles:
          - `ROLE_LEGAL_STATUS__SYNC__RW` (Read-Write)
      tags:
        - Sync
      operationId: sync-delete-imprisonmentStatus
      responses:
        '204':
          description: Successfully deleted Imprisonment Status.
        '404':
          $ref: '#/components/responses/404Error'
          description: Imprisonment status with specified UUID not found.

components:
  # --------------------------------------------------------------------------------
  # Schema and Enum Definitions
  # --------------------------------------------------------------------------------
  schemas:
    PrisonNumber:
      title: PrisonNumber
      description: The NOMIS Prison Reference Number of the Prisoner that the operation is being performed on.
      type: string
      pattern: "^[A-Z]\\d{4}[A-Z]{2}$"
      example: 'A1234BC'

    ErrorResponse:
      title: ErrorResponse
      description: |
        A generic response body object describing errors in a web request, and can be used to communicate several
        different types of error condition such as (but not limited to) `400 BAD REQUEST`, `409 CONFLICT` etc.
      properties:
        status:
          description: The HTTP status code.
          type: integer
          example: 404
        errorCode:
          description: An optional application specific error code.
          type: string
        userMessage:
          description: An optional human readable description of the error.
          type: string
          example: 'The specified resource was not found'
        developerMessage:
          description: An optional error message that may have more technical information for developers.
          type: string
        moreInfo:
          description: Optional more detailed information about the error.
          type: string
      required:
        - status

    CreateImprisonmentStatusRequest:
      title: CreateImprisonmentStatusRequest
      description: Object describing a new Imprisonment Status to be created
      todo: Add class properties
      properties:
        prisonNumber:
          $ref: '#/components/schemas/PrisonNumber'
      required:
        - prisonNumber

    ImprisonmentStatusResponse:
      title: ImprisonmentStatusResponse
      description: Object describing a single Imprisonment Status
      todo: Add class properties
      properties:
        prisonNumber:
          $ref: '#/components/schemas/PrisonNumber'
      required:
        - prisonNumber

  # --------------------------------------------------------------------------------
  # Request Body Definitions
  # --------------------------------------------------------------------------------
  requestBodies:
    SyncCreateImprisonmentStatus:
      description: Request body to allow the Sync process to create a single Imprisonment Status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateImprisonmentStatusRequest'

  # --------------------------------------------------------------------------------
  # Response Body Definitions
  # --------------------------------------------------------------------------------
  responses:
    400Error:
      description: Error response for a HTTP 400 describing fields in the request payload that are in error.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
        Access-Control-Allow-Methods:
          schema:
            type: string
        Access-Control-Allow-Headers:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            userMessage: 'Error on field date: rejected value [2023-06-01] cannot be in the past'
    404Error:
      description: |
        Error response for a HTTP 404 (not fond) describing the problem with the request.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
        Access-Control-Allow-Methods:
          schema:
            type: string
        Access-Control-Allow-Headers:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            userMessage: 'The specified resource was not found'
    409Error:
      description: |
        Error response for a HTTP 409 (conflict) describing the problem with the request.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
        Access-Control-Allow-Methods:
          schema:
            type: string
        Access-Control-Allow-Headers:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            userMessage: 'A resource already exists for prisoner [A1234BC]'
    SyncCreateImprisonmentStatus:
      description: Response body representing the single Imprisonment Status that has been created by the Sync process.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImprisonmentStatusResponse'

  parameters:
    prisonNumberPathParameter:
      name: prisonNumber
      schema:
        $ref: '#/components/schemas/PrisonNumber'
      description: The NOMIS Prison Reference Number of the Prisoner that the operation is being performed on.
      in: path
      required: true
    legacyImprisonmentStatusIdPathParameter:
      name: legacyImprisonmentStatusId
      description: The UUID of the Imprisonment Status that the operation is being performed on.
      schema:
        type: string
        format: uuid
      example: c88a6c48-97e2-4c04-93b5-98619966447b
      in: path
      required: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
