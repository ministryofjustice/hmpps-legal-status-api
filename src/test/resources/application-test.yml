server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/legal_status"
    username: "legal_status"
    password: "legal_status"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
